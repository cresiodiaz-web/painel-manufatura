<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Projetos & Core Tools</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --navy-900: #0a1836;
            --navy-800: #0f2555;
            --navy-700: #1a3a7a;
            --navy-600: #1e40af;
            --navy-500: #2563eb;
            --gold-500: #d4af37;
            --gold-400: #e5c158;
            --gold-300: #f4d47c;
            --gold-200: #fbf0c4;
            --cream: #fdfcf7;
            --white: #ffffff;
            --text-dark: #0a1836;
            --text-medium: #334155;
            --text-light: #64748b;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            color: var(--text-dark);
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at 15% 20%, rgba(37, 99, 235, 0.35) 0%, transparent 50%),
                radial-gradient(circle at 85% 80%, rgba(212, 175, 55, 0.20) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(15, 37, 85, 0.9) 0%, transparent 80%),
                linear-gradient(135deg, #0a1836 0%, #0f2555 50%, #0a1836 100%);
            background-attachment: fixed;
        }

        /* ===== FAIXA DE AVISOS ===== */
        .ticker-bar {
            height: 44px;
            background: linear-gradient(90deg, #0a1836 0%, #1a3a7a 50%, #0a1836 100%);
            border-bottom: 2px solid var(--gold-500);
            display: flex;
            align-items: center;
            overflow: hidden;
            position: relative;
            z-index: 20;
            box-shadow: 0 2px 20px rgba(212, 175, 55, 0.15);
        }
        .ticker-label {
            background: linear-gradient(135deg, var(--gold-500), var(--gold-400));
            color: var(--navy-900);
            padding: 0 18px;
            height: 100%;
            display: flex;
            align-items: center;
            font-weight: 900;
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            flex-shrink: 0;
            gap: 8px;
            box-shadow: 4px 0 15px rgba(212, 175, 55, 0.4);
            z-index: 2;
        }
        .ticker-label svg {
            width: 16px;
            height: 16px;
            fill: var(--navy-900);
        }
        .ticker-viewport {
            flex: 1;
            overflow: hidden;
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
        }
        .ticker-content {
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
            color: #e2e8f0;
            font-size: 0.82rem;
            font-weight: 500;
            animation: ticker-scroll 60s linear infinite;
            padding-left: 100%;
        }
        .ticker-content:hover { animation-play-state: paused; }
        .ticker-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0 30px;
            position: relative;
        }
        .ticker-item::after {
            content: '◆';
            color: var(--gold-500);
            margin-left: 30px;
            font-size: 0.5rem;
        }
        .ticker-item:last-child::after { display: none; }

        @keyframes ticker-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* ===== HEADER ===== */
        .header {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            background: rgba(10, 24, 54, 0.75);
            backdrop-filter: blur(14px);
            border-bottom: 3px solid transparent;
            border-image: linear-gradient(90deg, var(--gold-500), var(--navy-500), var(--gold-500)) 1;
            position: relative;
            z-index: 10;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo-badge {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--gold-500), var(--gold-400));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }
        .logo-badge svg { width: 24px; height: 24px; fill: var(--navy-900); }
        .header h1 {
            font-size: 1.35rem;
            letter-spacing: 0.5px;
            font-weight: 900;
            color: var(--white);
        }
        .header h1 span {
            background: linear-gradient(90deg, var(--gold-300), var(--gold-500));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-info {
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 0.85rem;
            color: #cbd5e1;
            font-weight: 500;
        }
        .header-info .clock {
            font-family: 'Courier New', monospace;
            font-size: 1.25rem;
            color: var(--gold-300);
            font-weight: 800;
            background: rgba(212, 175, 55, 0.12);
            padding: 6px 14px;
            border-radius: 10px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .status-dot {
            display: inline-block;
            width: 9px; height: 9px;
            border-radius: 50%;
            background: #10b981;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.7); }
            50% { box-shadow: 0 0 0 8px rgba(16,185,129,0); }
        }

        .btn-fullscreen {
            background: linear-gradient(135deg, var(--gold-500), var(--gold-400));
            color: var(--navy-900);
            border: none;
            padding: 9px 18px;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-fullscreen:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
        }
        .btn-fullscreen svg { width: 14px; height: 14px; fill: var(--navy-900); }

        /* ===== GRID ===== */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 18px;
            padding: 18px;
            height: calc(100vh - 116px);
        }

        .panel {
            background: rgba(253, 252, 247, 0.97);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            padding: 22px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(212, 175, 55, 0.15);
            transition: 0.3s;
        }
        .panel:hover {
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            border-radius: 18px 18px 0 0;
        }
        .panel-1 { grid-row: 1; grid-column: 1; }
        .panel-1::before { background: linear-gradient(90deg, var(--navy-600), var(--gold-500)); }
        .panel-2 { grid-row: 2; grid-column: 1; }
        .panel-2::before { background: linear-gradient(90deg, #059669, var(--gold-500)); }
        .panel-3 { grid-row: 1 / 3; grid-column: 2; }
        .panel-3::before { background: linear-gradient(90deg, var(--gold-500), #b45309); }

        .panel-title {
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--navy-700);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            font-weight: 900;
        }
        .panel-title-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .title-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--gold-500), var(--gold-400));
            box-shadow: 0 3px 8px rgba(212, 175, 55, 0.35);
        }
        .title-icon svg { width: 16px; height: 16px; fill: var(--navy-900); }
        .title-icon.blue { background: linear-gradient(135deg, var(--navy-600), var(--navy-500)); }
        .title-icon.blue svg { fill: var(--white); }
        .title-icon.green { background: linear-gradient(135deg, #059669, #10b981); }
        .title-icon.green svg { fill: var(--white); }

        .badge {
            background: linear-gradient(135deg, var(--navy-600), var(--navy-500));
            color: var(--white);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            box-shadow: 0 3px 8px rgba(30, 64, 175, 0.3);
        }
        .badge-gold {
            background: linear-gradient(135deg, var(--gold-500), var(--gold-400));
            color: var(--navy-900);
            box-shadow: 0 3px 8px rgba(212, 175, 55, 0.4);
        }

        /* ===== PAINEL 1 ===== */
        .p1-conteudo {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 16px;
            flex: 1;
            min-height: 0;
        }
        .projetos-coluna { display: flex; flex-direction: column; min-height: 0; }

        .projetos-lista {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: hidden;
            flex: 1;
            padding-right: 4px;
            position: relative;
            mask-image: linear-gradient(to bottom, transparent 0%, #000 6%, #000 94%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 6%, #000 94%, transparent 100%);
        }
        .projetos-track {
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: rolarProjetos 40s linear infinite;
        }
        .projetos-lista:hover .projetos-track { animation-play-state: paused; }

        @keyframes rolarProjetos {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        .projeto-item {
            background: var(--white);
            border-left: 5px solid var(--navy-600);
            border-radius: 10px;
            padding: 10px 14px;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(10, 24, 54, 0.06);
            border: 1px solid rgba(10, 24, 54, 0.06);
            border-left: 5px solid var(--navy-600);
        }
        .projeto-item:hover {
            transform: translateX(3px);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
            border-color: rgba(212, 175, 55, 0.3);
        }
        .projeto-linha1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            gap: 8px;
        }
        .projeto-nome {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--navy-900);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .projeto-status {
            font-size: 0.62rem;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            white-space: nowrap;
        }
        .status-concluido { background: #d1fae5; color: #065f46; }
        .status-execucao { background: #dbeafe; color: #1e40af; }
        .status-revisao { background: #fef3c7; color: #92400e; }
        .status-aguardando { background: #ede9fe; color: #5b21b6; }

        .projeto-progresso {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .barra-bg {
            flex: 1;
            height: 6px;
            background: #f1f5f9;
            border-radius: 4px;
            overflow: hidden;
        }
        .barra-fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; }
        .projeto-pct {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--navy-800);
            min-width: 36px;
            text-align: right;
            font-family: 'Courier New', monospace;
        }

        .grafico-coluna { display: flex; flex-direction: column; min-height: 0; }
        .grafico-wrapper { flex: 1; position: relative; min-height: 0; }
        .grafico-wrapper canvas { width: 100% !important; height: 100% !important; }

        .resumo-footer {
            display: flex;
            justify-content: space-around;
            padding-top: 12px;
            border-top: 2px dashed rgba(212, 175, 55, 0.3);
            margin-top: 12px;
            flex-shrink: 0;
        }
        .resumo-item { text-align: center; }
        .resumo-item .valor {
            font-size: 1.35rem;
            font-weight: 900;
            font-family: 'Courier New', monospace;
        }
        .resumo-item .label {
            font-size: 0.6rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
            font-weight: 700;
        }
        .resumo-total .valor { color: var(--navy-600); }
        .resumo-concluido .valor { color: #059669; }
        .resumo-andamento .valor { color: #d97706; }
        .resumo-atrasado .valor { color: #dc2626; }

        /* ===== PAINEL 2 ===== */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            flex: 1;
            align-content: center;
        }
        .tool-card {
            background: var(--white);
            border: 2px solid #f1f5f9;
            border-radius: 14px;
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 6px;
            transition: 0.25s;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(10, 24, 54, 0.04);
        }
        .tool-card:hover {
            transform: translateY(-4px);
            border-color: var(--gold-500);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
            background: linear-gradient(180deg, #ffffff, var(--cream));
        }
        .tool-icone {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(30, 64, 175, 0.1), rgba(212, 175, 55, 0.15));
        }
        .tool-icone svg { width: 24px; height: 24px; fill: var(--navy-600); }
        .tool-sigla {
            font-size: 0.85rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--navy-800);
        }
        .tool-nome {
            font-size: 0.6rem;
            color: var(--text-light);
            line-height: 1.2;
            min-height: 24px;
            font-weight: 500;
        }
        .tool-status-bolinha {
            width: 12px; height: 12px;
            border-radius: 50%;
            margin-top: 2px;
        }
        .status-verde { background: #10b981; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2); }
        .status-amarelo { background: #f59e0b; box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.2); }
        .status-vermelho { background: #ef4444; box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2); }
        .tool-nivel {
            font-size: 0.75rem;
            font-weight: 900;
            color: var(--navy-700);
            font-family: 'Courier New', monospace;
            margin-top: 2px;
        }

        /* ===== PAINEL 3 - VÍDEO ===== */
        .video-container {
            flex: 1;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 6px 25px rgba(212, 175, 55, 0.25);
            border: 2px solid rgba(212, 175, 55, 0.3);
        }

        /* Player genérico (serve para iframe e video) */
        .player-wrapper {
            flex: 1;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .player-wrapper iframe,
        .player-wrapper video {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            object-fit: contain;
        }

        /* Indicador de tipo de vídeo */
        .tipo-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 5;
            backdrop-filter: blur(4px);
        }
        .tipo-badge.local { background: rgba(30, 64, 175, 0.85); }
        .tipo-badge.youtube { background: rgba(220, 38, 38, 0.85); }
        .tipo-badge svg { width: 12px; height: 12px; fill: #fff; }

        .video-info {
            padding: 14px 18px;
            background: linear-gradient(135deg, var(--navy-800), var(--navy-700));
            border-top: 3px solid var(--gold-500);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .video-meta h3 {
            font-size: 1rem;
            color: var(--gold-300);
            font-weight: 800;
            margin-bottom: 3px;
        }
        .video-meta p {
            font-size: 0.75rem;
            color: #cbd5e1;
            font-weight: 500;
        }
        .video-duracao {
            background: linear-gradient(135deg, var(--gold-500), var(--gold-400));
            color: var(--navy-900);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 900;
            font-family: 'Courier New', monospace;
            white-space: nowrap;
            box-shadow: 0 3px 8px rgba(212, 175, 55, 0.5);
        }

        .playlist-nav {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: var(--cream);
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            justify-content: center;
            flex-wrap: wrap;
        }
        .playlist-dot {
            width: 34px; height: 30px;
            border-radius: 8px;
            background: var(--white);
            border: 2px solid rgba(212, 175, 55, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--navy-700);
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(212, 175, 55, 0.15);
            position: relative;
            gap: 3px;
        }
        .playlist-dot:hover { background: var(--gold-200); transform: scale(1.05); }
        .playlist-dot.active {
            background: linear-gradient(135deg, var(--gold-500), var(--gold-400));
            color: var(--navy-900);
            border-color: var(--gold-500);
            transform: scale(1.12);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.6);
        }
        .playlist-dot.done {
            background: #d1fae5;
            color: #059669;
            border-color: #10b981;
        }
        .playlist-dot .mini-icon {
            width: 10px;
            height: 10px;
            fill: currentColor;
        }

        .progresso-video {
            height: 4px;
            background: rgba(212, 175, 55, 0.15);
            position: relative;
            overflow: hidden;
        }
        .progresso-video-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gold-500), var(--gold-300));
            width: 0%;
            transition: width 1s linear;
        }

        /* ===== QR CODE ===== */
        .qr-flutuante {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, var(--white), var(--cream));
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(212, 175, 55, 0.4);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            cursor: pointer;
            border: 2px solid var(--gold-500);
        }
        .qr-flutuante:hover {
            transform: scale(1.05) rotate(-2deg);
            box-shadow: 0 15px 50px rgba(212, 175, 55, 0.6);
        }
        .qr-flutuante #qrcode {
            width: 105px;
            height: 105px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            background: #fff;
            border-radius: 8px;
        }
        .qr-flutuante #qrcode img,
        .qr-flutuante #qrcode canvas {
            width: 100% !important;
            height: 100% !important;
        }
        .qr-label {
            font-size: 0.65rem;
            font-weight: 900;
            color: var(--navy-800);
            text-align: center;
            letter-spacing: 0.5px;
        }
        .qr-minimizar {
            position: absolute;
            top: -10px;
            right: -10px;
            background: linear-gradient(135deg, #dc2626, #ef4444);
            color: #fff;
            border: 2px solid #fff;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            font-weight: 800;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(220, 38, 38, 0.5);
        }
        .qr-flutuante.minimizado { padding: 10px 14px; border-radius: 24px; }
        .qr-flutuante.minimizado #qrcode { display: none; }
        .qr-flutuante.minimizado .qr-label { font-size: 0.8rem; color: var(--navy-700); }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 900px) {
            body { overflow: auto; height: auto; }
            .dashboard-grid {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
                height: auto;
            }
            .panel-1, .panel-2, .panel-3 {
                grid-row: auto;
                grid-column: 1;
                min-height: 340px;
            }
            .panel-3 { min-height: 420px; }
            .tools-grid { grid-template-columns: repeat(3, 1fr); }
            .p1-conteudo { grid-template-columns: 1fr; }
            .grafico-coluna { min-height: 180px; }
        }
        @media (max-width: 500px) {
            .header { flex-direction: column; height: auto; padding: 12px; gap: 10px; }
            .header-info { flex-wrap: wrap; justify-content: center; }
            .tools-grid { grid-template-columns: repeat(2, 1fr); }
            .qr-flutuante { bottom: 10px; right: 10px; }
            .qr-flutuante #qrcode { width: 75px; height: 75px; }
            .ticker-label { font-size: 0.6rem; padding: 0 10px; }
            .ticker-content { font-size: 0.72rem; }
        }
    </style>
</head>
<body>

    <!-- ===== FAIXA DE AVISOS ===== -->
    <div class="ticker-bar">
        <div class="ticker-label">
            <svg viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 4l7.53 13H4.47L12 6zm-1 5v4h2v-4h-2zm0 5v2h2v-2h-2z"/></svg>
            Avisos
        </div>
        <div class="ticker-viewport">
            <div class="ticker-content" id="tickerContent">
                <span class="ticker-item">Carregando avisos...</span>
            </div>
        </div>
    </div>

    <!-- ===== HEADER ===== -->
    <div class="header">
        <div class="header-left">
            <div class="logo-badge">
                <svg viewBox="0 0 24 24"><path d="M4 4h16v2H4V4zm0 4h16v2H4V8zm0 4h10v2H4v-2zm0 4h16v2H4v-2zm0 4h10v2H4v-2z"/></svg>
            </div>
            <h1>CENTRAL DE <span>PROJETOS</span> & CORE TOOLS</h1>
        </div>
        <div class="header-info">
            <span><span class="status-dot"></span>Sistema Online</span>
            <span id="dataAtual">--/--/----</span>
            <span class="clock" id="relogio">00:00:00</span>
            <button class="btn-fullscreen" id="btnFullscreen">
                <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                Tela Cheia
            </button>
        </div>
    </div>

    <!-- ===== GRID ===== -->
    <div class="dashboard-grid">

        <!-- PAINEL 1 -->
        <div class="panel panel-1">
            <div class="panel-title">
                <div class="panel-title-left">
                    <div class="title-icon blue">
                        <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                    </div>
                    Projetos em Andamento
                </div>
                <span class="badge" id="p1-badge">--</span>
            </div>
            <div class="p1-conteudo">
                <div class="projetos-coluna">
                    <div class="projetos-lista" id="p1-lista">
                        <div class="projetos-track" id="p1-track">
                            <div style="color:#64748b; text-align:center; padding:20px;">Carregando...</div>
                        </div>
                    </div>
                </div>
                <div class="grafico-coluna">
                    <div class="grafico-wrapper">
                        <canvas id="graficoProjetos"></canvas>
                    </div>
                </div>
            </div>
            <div class="resumo-footer">
                <div class="resumo-item resumo-total">
                    <div class="valor" id="p1-total">0</div>
                    <div class="label">Total</div>
                </div>
                <div class="resumo-item resumo-concluido">
                    <div class="valor" id="p1-concluidos">0</div>
                    <div class="label">Concluídos</div>
                </div>
                <div class="resumo-item resumo-andamento">
                    <div class="valor" id="p1-andamento">0</div>
                    <div class="label">Andamento</div>
                </div>
                <div class="resumo-item resumo-atrasado">
                    <div class="valor" id="p1-atrasados">0</div>
                    <div class="label">Atrasados</div>
                </div>
            </div>
        </div>

        <!-- PAINEL 2 -->
        <div class="panel panel-2">
            <div class="panel-title">
                <div class="panel-title-left">
                    <div class="title-icon green">
                        <svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
                    </div>
                    Core Tools — Status
                </div>
                <span class="badge badge-gold">Qualidade</span>
            </div>
            <div class="tools-grid" id="p2-grid">
                <div style="color:#64748b; grid-column:1/-1; text-align:center; padding:20px;">Carregando...</div>
            </div>
        </div>

        <!-- PAINEL 3 - PLAYER MISTO -->
        <div class="panel panel-3">
            <div class="panel-title">
                <div class="panel-title-left">
                    <div class="title-icon">
                        <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                    </div>
                    Treinamento em Destaque
                </div>
                <span class="badge badge-gold" id="p3-contador">1 / 1</span>
            </div>
            <div class="video-container">
                <!-- Container do player — o JS decide se insere <iframe> ou <video> -->
                <div class="player-wrapper" id="playerWrapper">
                    <div class="tipo-badge" id="tipoBadge" style="display:none;"></div>
                </div>
                <div class="progresso-video">
                    <div class="progresso-video-fill" id="progressoVideo"></div>
                </div>
                <div class="video-info">
                    <div class="video-meta">
                        <h3 id="videoTitulo">Carregando...</h3>
                        <p id="videoDescricao">--</p>
                    </div>
                    <span class="video-duracao" id="videoDuracao">--:--</span>
                </div>
            </div>
            <div class="playlist-nav" id="playlistNav"></div>
        </div>
    </div>

    <!-- ===== QR CODE ===== -->
    <div class="qr-flutuante" id="qrFlutuante" title="Aponte a câmera do celular">
        <button class="qr-minimizar" id="qrMinimizar" title="Minimizar">−</button>
        <div id="qrcode"></div>
        <div class="qr-label">Abrir no celular</div>
    </div>

    <script>
        const FONTES = {
            painel1: './dados/painel1.json',
            painel2: './dados/painel2.json',
            painel3: './dados/painel3.json'
        };

        const URL_PADRAO_PAINEL = window.location.href.split('?')[0];

        let graficoProjetos = null;
        let videosPlaylist = [];
        let videoAtual = 0;
        let tempoTrocaVideo = 60;
        let intervaloVideo = null;
        let intervaloProgresso = null;
        let segundosDecorridos = 0;
        let videoElementAtual = null; // referência ao <video> quando for local

        async function buscar(url) {
            try {
                const r = await fetch(url + '?v=' + Date.now());
                if (!r.ok) throw new Error('Erro ' + url);
                return await r.json();
            } catch (e) {
                console.error('Falha ao buscar', url, e);
                return null;
            }
        }

        function classeStatus(status) {
            const s = (status || '').toLowerCase();
            if (s.includes('conclu')) return 'status-concluido';
            if (s.includes('execu')) return 'status-execucao';
            if (s.includes('revis')) return 'status-revisao';
            if (s.includes('aguard')) return 'status-aguardando';
            return 'status-execucao';
        }

        function classeBolinha(status) {
            const s = (status || '').toLowerCase();
            if (s.includes('verde')) return 'status-verde';
            if (s.includes('amarelo')) return 'status-amarelo';
            if (s.includes('vermelho')) return 'status-vermelho';
            return 'status-verde';
        }

        const ICONES_TOOLS = {
            'APQP': '<svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm0 4c1.66 0 3 1.34 3 3h-2c0-.55-.45-1-1-1s-1 .45-1 1h-2c0-1.66 1.34-3 3-3zm-3 8c0-1.66 1.34-3 3-3h6v2h-6c-.55 0-1 .45-1 1s.45 1 1 1h2v2H9c-1.66 0-3-1.34-3-3z"/></svg>',
            'FMEA': '<svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>',
            'MSA': '<svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>',
            'SPC': '<svg viewBox="0 0 24 24"><path d="M3.5 18.5l6-6 4 4L22 7.92 20.59 6.5l-7.09 8.5-4-4L2 18.5z"/></svg>',
            'PPAP': '<svg viewBox="0 0 24 24"><path d="M9 16.2l-3.5-3.5L4 14.2l5 5 11-11-1.5-1.5z"/></svg>'
        };

        // Ícones para diferenciar tipo de vídeo na playlist
        const ICONE_LOCAL = '<svg class="mini-icon" viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/></svg>';
        const ICONE_YOUTUBE = '<svg class="mini-icon" viewBox="0 0 24 24"><path d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 19c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73.47-.13 1.33-.22 2.65-.28 1.3-.07 2.49-.1 3.59-.1L12 5c4.19 0 6.8.16 7.83.44.9.25 1.48.83 1.73 1.73z"/></svg>';

        function atualizarRelogio() {
            const agora = new Date();
            document.getElementById('relogio').textContent = agora.toLocaleTimeString('pt-BR');
            document.getElementById('dataAtual').textContent = agora.toLocaleDateString('pt-BR');
        }
        setInterval(atualizarRelogio, 1000);
        atualizarRelogio();

        document.getElementById('btnFullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        });

        function gerarQRCode(url) {
            const container = document.getElementById('qrcode');
            container.innerHTML = '';
            new QRCode(container, {
                text: url,
                width: 120,
                height: 120,
                colorDark: '#0a1836',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        document.getElementById('qrMinimizar').addEventListener('click', (e) => {
            e.stopPropagation();
            const qr = document.getElementById('qrFlutuante');
            qr.classList.toggle('minimizado');
            e.target.textContent = qr.classList.contains('minimizado') ? '📱' : '−';
        });

        function montarTicker(avisos) {
            const container = document.getElementById('tickerContent');
            container.innerHTML = '';
            if (!avisos || !avisos.length) {
                container.innerHTML = '<span class="ticker-item">Nenhum aviso no momento</span>';
                return;
            }
            avisos.forEach(texto => {
                const item = document.createElement('span');
                item.className = 'ticker-item';
                item.textContent = texto;
                container.appendChild(item);
            });
            const duracao = Math.max(30, avisos.length * 8);
            container.style.animationDuration = duracao + 's';
        }

        // ===== PAINEL 1 =====
        async function atualizarPainel1() {
            const dados = await buscar(FONTES.painel1);
            if (!dados) return;

            montarTicker(dados.avisos);

            const track = document.getElementById('p1-track');
            track.innerHTML = '';

            const fragment = document.createDocumentFragment();
            dados.projetos.forEach(p => {
                const item = document.createElement('div');
                item.className = 'projeto-item';
                item.style.borderLeftColor = p.cor || '#1e40af';
                item.innerHTML = `
                    <div class="projeto-linha1">
                        <span class="projeto-nome">${p.nome}</span>
                        <span class="projeto-status ${classeStatus(p.status)}">${p.status}</span>
                    </div>
                    <div class="projeto-progresso">
                        <div class="barra-bg">
                            <div class="barra-fill" style="width:${p.progresso}%; background:${p.cor};"></div>
                        </div>
                        <span class="projeto-pct">${p.progresso}%</span>
                    </div>
                `;
                fragment.appendChild(item);
            });
            track.appendChild(fragment);

            // Duplica para loop contínuo
            const clonado = fragment.cloneNode(true);
            track.appendChild(clonado);

            const qtdProjetos = dados.projetos.length;
            const duracao = Math.max(20, qtdProjetos * 4);
            track.style.animationDuration = duracao + 's';
            if (qtdProjetos <= 2) track.style.animation = 'none';

            const r = dados.resumo || {};
            document.getElementById('p1-total').textContent = r.total || dados.projetos.length;
            document.getElementById('p1-concluidos').textContent = r.concluidos || 0;
            document.getElementById('p1-andamento').textContent = r.emAndamento || 0;
            document.getElementById('p1-atrasados').textContent = r.atrasados || 0;
            document.getElementById('p1-badge').textContent = dados.projetos.length + ' ativos';

            const contagem = { 'Concluído': 0, 'Em execução': 0, 'Revisão': 0, 'Aguardando': 0 };
            dados.projetos.forEach(p => {
                const s = (p.status || '').toLowerCase();
                if (s.includes('conclu')) contagem['Concluído']++;
                else if (s.includes('execu')) contagem['Em execução']++;
                else if (s.includes('revis')) contagem['Revisão']++;
                else if (s.includes('aguard')) contagem['Aguardando']++;
            });

            const labels = Object.keys(contagem).filter(k => contagem[k] > 0);
            const valores = labels.map(k => contagem[k]);
            const cores = labels.map(l => {
                if (l === 'Concluído') return '#059669';
                if (l === 'Em execução') return '#1e40af';
                if (l === 'Revisão') return '#d97706';
                return '#7c3aed';
            });

            const ctx = document.getElementById('graficoProjetos').getContext('2d');
            if (graficoProjetos) {
                graficoProjetos.data.labels = labels;
                graficoProjetos.data.datasets[0].data = valores;
                graficoProjetos.data.datasets[0].backgroundColor = cores;
                graficoProjetos.update('none');
            } else {
                graficoProjetos = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: valores,
                            backgroundColor: cores,
                            borderColor: '#fdfcf7',
                            borderWidth: 4,
                            hoverOffset: 10
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '62%',
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {
                                    color: '#1a3a7a',
                                    font: { size: 10, weight: '700', family: 'Segoe UI' },
                                    padding: 8,
                                    boxWidth: 10,
                                    boxHeight: 10,
                                    usePointStyle: true
                                }
                            },
                            tooltip: {
                                backgroundColor: '#0a1836',
                                titleColor: '#f4d47c',
                                bodyColor: '#ffffff',
                                padding: 10,
                                borderColor: '#d4af37',
                                borderWidth: 1,
                                callbacks: {
                                    label: (ctx) => {
                                        const total = ctx.dataset.data.reduce((a,b)=>a+b,0);
                                        const pct = ((ctx.raw / total) * 100).toFixed(0);
                                        return ` ${ctx.label}: ${ctx.raw} (${pct}%)`;
                                    }
                                }
                            }
                        }
                    }
                });
            }

            const urlParaQR = dados.urlPainel || URL_PADRAO_PAINEL;
            gerarQRCode(urlParaQR);
        }

        // ===== PAINEL 2 =====
        async function atualizarPainel2() {
            const dados = await buscar(FONTES.painel2);
            if (!dados) return;
            const grid = document.getElementById('p2-grid');
            grid.innerHTML = '';
            dados.ferramentas.forEach(f => {
                const card = document.createElement('div');
                card.className = 'tool-card';
                const icone = ICONES_TOOLS[f.sigla] || '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>';
                card.innerHTML = `
                    <div class="tool-icone">${icone}</div>
                    <div class="tool-sigla">${f.sigla}</div>
                    <div class="tool-nome">${f.nome}</div>
                    <div class="tool-status-bolinha ${classeBolinha(f.status)}"></div>
                    <div class="tool-nivel">${f.nivel}%</div>
                `;
                card.title = `${f.nome} — Responsável: ${f.responsavel}`;
                grid.appendChild(card);
            });
        }

        // ===== PAINEL 3 - PLAYER MISTO =====
        async function carregarPlaylist() {
            const dados = await buscar(FONTES.painel3);
            if (!dados || !dados.videos) return;
            videosPlaylist = dados.videos;
            tempoTrocaVideo = dados.tempoTroca || 60;
            montarNavPlaylist();
            tocarVideo(0);
            iniciarCicloVideo();
        }

        function montarNavPlaylist() {
            const nav = document.getElementById('playlistNav');
            nav.innerHTML = '';
            videosPlaylist.forEach((v, i) => {
                const dot = document.createElement('div');
                dot.className = 'playlist-dot';
                dot.title = `${v.titulo} (${v.tipo === 'local' ? 'Local' : 'YouTube'})`;
                const icone = v.tipo === 'local' ? ICONE_LOCAL : ICONE_YOUTUBE;
                dot.innerHTML = `${icone}<span>${i + 1}</span>`;
                dot.addEventListener('click', () => {
                    tocarVideo(i);
                    reiniciarCiclo();
                });
                nav.appendChild(dot);
            });
        }

        function tocarVideo(index) {
            if (!videosPlaylist.length) return;
            videoAtual = index;
            const v = videosPlaylist[index];

            // Limpa o player anterior
            const wrapper = document.getElementById('playerWrapper');
            wrapper.innerHTML = '';

            // Cria o badge de tipo
            const badge = document.createElement('div');
            badge.className = 'tipo-badge ' + (v.tipo === 'local' ? 'local' : 'youtube');

            if (v.tipo === 'local') {
                // 🔵 VÍDEO LOCAL (MP4)
                badge.innerHTML = `${ICONE_LOCAL}<span>VÍDEO INTERNO</span>`;
                wrapper.appendChild(badge);

                const video = document.createElement('video');
                video.src = v.arquivo;
                video.controls = false;      // painel de controle oculto (modo telão)
                video.autoplay = true;
                video.muted = true;          // obrigatório para autoplay no navegador
                video.loop = false;
                video.playsInline = true;
                video.preload = 'auto';

                // Quando o vídeo local terminar, avança para o próximo
                video.addEventListener('ended', () => {
                    avancarVideo();
                });

                // Se der erro (arquivo não encontrado), pula para o próximo
                video.addEventListener('error', () => {
                    console.warn('Erro ao carregar vídeo local:', v.arquivo);
                    avancarVideo();
                });

                wrapper.appendChild(video);
                videoElementAtual = video;

                // Tenta iniciar a reprodução
                const playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.catch(err => {
                        console.warn('Autoplay bloqueado:', err);
                    });
                }

            } else {
                // 🔴 VÍDEO DO YOUTUBE
                badge.innerHTML = `${ICONE_YOUTUBE}<span>YOUTUBE</span>`;
                wrapper.appendChild(badge);

                const iframe = document.createElement('iframe');
                iframe.src = `https://www.youtube.com/embed/${v.id}?autoplay=1&mute=1&rel=0&modestbranding=1`;
                iframe.title = v.titulo;
                iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
                iframe.allowFullscreen = true;
                wrapper.appendChild(iframe);
                videoElementAtual = null;
            }

            // Atualiza metadados
            document.getElementById('videoTitulo').textContent = v.titulo;
            document.getElementById('videoDescricao').textContent = v.descricao;
            document.getElementById('videoDuracao').textContent = v.duracao;
            document.getElementById('p3-contador').textContent = `${index + 1} / ${videosPlaylist.length}`;

            // Atualiza dots da playlist
            document.querySelectorAll('.playlist-dot').forEach((d, i) => {
                d.classList.toggle('active', i === index);
            });

            segundosDecorridos = 0;
            document.getElementById('progressoVideo').style.width = '0%';
        }

        function avancarVideo() {
            const dots = document.querySelectorAll('.playlist-dot');
            if (dots[videoAtual]) dots[videoAtual].classList.add('done');
            const proximo = (videoAtual + 1) % videosPlaylist.length;
            tocarVideo(proximo);
            segundosDecorridos = 0;
        }

        function iniciarCicloVideo() {
            // Timer de troca automática (aplica aos vídeos do YouTube)
            intervaloVideo = setInterval(() => {
                // Só troca automaticamente se NÃO for vídeo local
                // (vídeos locais avançam quando terminam pelo evento 'ended')
                const atual = videosPlaylist[videoAtual];
                if (!atual || atual.tipo !== 'local') {
                    avancarVideo();
                }
            }, tempoTrocaVideo * 1000);

            // Progresso visual (barra inferior)
            intervaloProgresso = setInterval(() => {
                segundosDecorridos++;
                const pct = Math.min(100, (segundosDecorridos / tempoTrocaVideo) * 100);
                document.getElementById('progressoVideo').style.width = pct + '%';
            }, 1000);
        }

        function reiniciarCiclo() {
            clearInterval(intervaloVideo);
            clearInterval(intervaloProgresso);
            segundosDecorridos = 0;
            iniciarCicloVideo();
        }

        async function atualizarTudo() {
            await Promise.all([atualizarPainel1(), atualizarPainel2()]);
        }
        atualizarTudo();
        carregarPlaylist();
        setInterval(atualizarTudo, 30000);

        console.log('%c🎬 Painel misto: YouTube + vídeos locais', 'color:#d4af37; font-size:14px; font-weight:bold;');
    </script>
