<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Projetos & Core Tools</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #0f172a;
            height: 100vh;
            overflow: hidden;
            /* 🌈 Fundo colorido com gradiente suave e bolhas de luz */
            background:
                radial-gradient(circle at 10% 20%, rgba(96, 165, 250, 0.35) 0%, transparent 45%),
                radial-gradient(circle at 90% 10%, rgba(167, 139, 250, 0.35) 0%, transparent 45%),
                radial-gradient(circle at 80% 90%, rgba(52, 211, 153, 0.3) 0%, transparent 45%),
                radial-gradient(circle at 20% 85%, rgba(251, 191, 36, 0.25) 0%, transparent 45%),
                linear-gradient(135deg, #eef2ff 0%, #f0f9ff 50%, #ecfdf5 100%);
            background-attachment: fixed;
        }

        /* ===== HEADER ===== */
        .header {
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 3px solid transparent;
            border-image: linear-gradient(90deg, #3b82f6, #8b5cf6, #10b981, #f59e0b) 1;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
            position: relative;
            z-index: 10;
        }
        .header h1 {
            font-size: 1.4rem;
            letter-spacing: 0.5px;
            font-weight: 900;
            background: linear-gradient(90deg, #2563eb 0%, #7c3aed 50%, #059669 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-info {
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 0.9rem;
            color: #475569;
            font-weight: 500;
        }
        .header-info .clock {
            font-family: 'Courier New', monospace;
            font-size: 1.25rem;
            color: #1e293b;
            font-weight: 800;
            background: rgba(59, 130, 246, 0.1);
            padding: 4px 12px;
            border-radius: 8px;
        }
        .status-dot {
            display: inline-block;
            width: 9px; height: 9px;
            border-radius: 50%;
            background: #10b981;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.7); }
            50% { box-shadow: 0 0 0 8px rgba(16,185,129,0); }
        }

        .btn-fullscreen {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
            transition: 0.2s;
        }
        .btn-fullscreen:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.5);
        }

        /* ===== GRID ===== */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 18px;
            padding: 18px;
            height: calc(100vh - 68px);
        }

        .panel {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            padding: 22px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.9);
            transition: 0.3s;
        }
        .panel:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(15, 23, 42, 0.12);
        }

        /* Faixas coloridas no topo de cada painel */
        .panel-1 {
            grid-row: 1; grid-column: 1;
            background: linear-gradient(180deg, #eff6ff 0%, #ffffff 12%);
        }
        .panel-1::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            border-radius: 18px 18px 0 0;
        }

        .panel-2 {
            grid-row: 2; grid-column: 1;
            background: linear-gradient(180deg, #ecfdf5 0%, #ffffff 12%);
        }
        .panel-2::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, #10b981, #34d399);
            border-radius: 18px 18px 0 0;
        }

        .panel-3 {
            grid-row: 1 / 3; grid-column: 2;
            background: linear-gradient(180deg, #fffbeb 0%, #ffffff 8%);
        }
        .panel-3::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            border-radius: 18px 18px 0 0;
        }

        .panel-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #475569;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            font-weight: 800;
        }
        .panel-title i {
            font-style: normal;
            margin-right: 8px;
            font-size: 1.1rem;
        }

        .badge {
            background: linear-gradient(135deg, #dbeafe, #bfdbfe);
            color: #1e40af;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 6px rgba(59, 130, 246, 0.2);
        }
        .badge-verde {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            color: #065f46;
            box-shadow: 0 2px 6px rgba(16, 185, 129, 0.2);
        }
        .badge-laranja {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            color: #92400e;
            box-shadow: 0 2px 6px rgba(245, 158, 11, 0.2);
        }

        /* ===== PAINEL 1 ===== */
        .p1-conteudo {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 16px;
            flex: 1;
            min-height: 0;
        }
        .projetos-coluna { display: flex; flex-direction: column; min-height: 0; }
        .projetos-lista {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
        }
        .projetos-lista::-webkit-scrollbar { width: 5px; }
        .projetos-lista::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.3);
            border-radius: 4px;
        }

        .projeto-item {
            background: #ffffff;
            border-left: 5px solid #3b82f6;
            border-radius: 10px;
            padding: 10px 14px;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
        }
        .projeto-item:hover {
            transform: translateX(3px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
        }
        .projeto-linha1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            gap: 8px;
        }
        .projeto-nome {
            font-size: 0.85rem;
            font-weight: 700;
            color: #1e293b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .projeto-status {
            font-size: 0.62rem;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            white-space: nowrap;
        }
        .status-concluido { background: #d1fae5; color: #065f46; }
        .status-execucao { background: #dbeafe; color: #1e40af; }
        .status-revisao { background: #fef3c7; color: #92400e; }
        .status-aguardando { background: #ede9fe; color: #5b21b6; }

        .projeto-progresso {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .barra-bg {
            flex: 1;
            height: 6px;
            background: #f1f5f9;
            border-radius: 4px;
            overflow: hidden;
        }
        .barra-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.8s ease;
        }
        .projeto-pct {
            font-size: 0.72rem;
            font-weight: 800;
            color: #334155;
            min-width: 36px;
            text-align: right;
            font-family: 'Courier New', monospace;
        }

        .grafico-coluna { display: flex; flex-direction: column; min-height: 0; }
        .grafico-wrapper { flex: 1; position: relative; min-height: 0; }
        .grafico-wrapper canvas { width: 100% !important; height: 100% !important; }

        .resumo-footer {
            display: flex;
            justify-content: space-around;
            padding-top: 12px;
            border-top: 2px dashed #e2e8f0;
            margin-top: 12px;
            flex-shrink: 0;
        }
        .resumo-item { text-align: center; }
        .resumo-item .valor {
            font-size: 1.35rem;
            font-weight: 900;
            font-family: 'Courier New', monospace;
        }
        .resumo-item .label {
            font-size: 0.6rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
            font-weight: 700;
        }
        .resumo-total .valor { color: #2563eb; }
        .resumo-concluido .valor { color: #059669; }
        .resumo-andamento .valor { color: #d97706; }
        .resumo-atrasado .valor { color: #dc2626; }

        /* ===== PAINEL 2 ===== */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            flex: 1;
            align-content: center;
        }
        .tool-card {
            background: #ffffff;
            border: 2px solid #f1f5f9;
            border-radius: 14px;
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 6px;
            transition: 0.25s;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
        }
        .tool-card:hover {
            transform: translateY(-4px);
            border-color: #10b981;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.2);
            background: linear-gradient(180deg, #ffffff, #ecfdf5);
        }
        .tool-icone {
            font-size: 1.7rem;
            line-height: 1;
        }
        .tool-sigla {
            font-size: 0.85rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: #065f46;
        }
        .tool-nome {
            font-size: 0.6rem;
            color: #64748b;
            line-height: 1.2;
            min-height: 24px;
            font-weight: 500;
        }
        .tool-status-bolinha {
            width: 12px; height: 12px;
            border-radius: 50%;
            margin-top: 2px;
            position: relative;
        }
        .status-verde {
            background: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
        }
        .status-amarelo {
            background: #f59e0b;
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.2);
        }
        .status-vermelho {
            background: #ef4444;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2);
        }
        .tool-nivel {
            font-size: 0.75rem;
            font-weight: 900;
            color: #334155;
            font-family: 'Courier New', monospace;
            margin-top: 2px;
        }

        /* ===== PAINEL 3 ===== */
        .video-container {
            flex: 1;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.2);
            border: 2px solid #fef3c7;
        }
        .video-frame { width: 100%; flex: 1; border: none; background: #000; }
        .video-info {
            padding: 14px 18px;
            background: linear-gradient(135deg, #fffbeb, #fef3c7);
            border-top: 3px solid #f59e0b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .video-meta h3 {
            font-size: 1rem;
            color: #78350f;
            font-weight: 800;
            margin-bottom: 3px;
        }
        .video-meta p {
            font-size: 0.75rem;
            color: #92400e;
            font-weight: 500;
        }
        .video-duracao {
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
            color: #fff;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 800;
            font-family: 'Courier New', monospace;
            white-space: nowrap;
            box-shadow: 0 3px 8px rgba(245, 158, 11, 0.3);
        }

        .playlist-nav {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: #fffbeb;
            border-top: 1px solid #fef3c7;
            justify-content: center;
            flex-wrap: wrap;
        }
        .playlist-dot {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #fde68a;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 800;
            color: #92400e;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(245, 158, 11, 0.15);
        }
        .playlist-dot:hover {
            background: #fef3c7;
            transform: scale(1.05);
        }
        .playlist-dot.active {
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
            color: #fff;
            border-color: #f59e0b;
            transform: scale(1.15);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.5);
        }
        .playlist-dot.done {
            background: #d1fae5;
            color: #059669;
            border-color: #10b981;
        }

        .progresso-video {
            height: 4px;
            background: #fef3c7;
            position: relative;
            overflow: hidden;
        }
        .progresso-video-fill {
            height: 100%;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            width: 0%;
            transition: width 1s linear;
        }

        /* ===== QR CODE ===== */
        .qr-flutuante {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ffffff, #f8fafc);
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.3);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            cursor: pointer;
            border: 2px solid #dbeafe;
        }
        .qr-flutuante:hover {
            transform: scale(1.05) rotate(-2deg);
            box-shadow: 0 15px 50px rgba(59, 130, 246, 0.5);
            border-color: #3b82f6;
        }
        .qr-flutuante #qrcode {
            width: 105px;
            height: 105px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            background: #fff;
            border-radius: 8px;
        }
        .qr-flutuante #qrcode img,
        .qr-flutuante #qrcode canvas {
            width: 100% !important;
            height: 100% !important;
        }
        .qr-label {
            font-size: 0.65rem;
            font-weight: 800;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .qr-minimizar {
            position: absolute;
            top: -10px;
            right: -10px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            border: 2px solid #fff;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            font-weight: 800;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(239, 68, 68, 0.4);
        }
        .qr-flutuante.minimizado {
            padding: 10px 14px;
            border-radius: 24px;
        }
        .qr-flutuante.minimizado #qrcode { display: none; }
        .qr-flutuante.minimizado .qr-label {
            font-size: 0.8rem;
            color: #3b82f6;
            background: none;
            -webkit-text-fill-color: #3b82f6;
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 900px) {
            body { overflow: auto; height: auto; }
            .dashboard-grid {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
                height: auto;
            }
            .panel-1, .panel-2, .panel-3 {
                grid-row: auto;
                grid-column: 1;
                min-height: 340px;
            }
            .panel-3 { min-height: 420px; }
            .tools-grid { grid-template-columns: repeat(3, 1fr); }
            .p1-conteudo { grid-template-columns: 1fr; }
            .grafico-coluna { min-height: 180px; }
        }
        @media (max-width: 500px) {
            .header { flex-direction: column; height: auto; padding: 12px; gap: 10px; }
            .header-info { flex-wrap: wrap; justify-content: center; }
            .tools-grid { grid-template-columns: repeat(2, 1fr); }
            .qr-flutuante { bottom: 10px; right: 10px; }
            .qr-flutuante #qrcode { width: 75px; height: 75px; }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <div class="header">
        <h1>⚙️ CENTRAL DE PROJETOS & CORE TOOLS</h1>
        <div class="header-info">
            <span><span class="status-dot"></span>Sistema Online</span>
            <span id="dataAtual">--/--/----</span>
            <span class="clock" id="relogio">00:00:00</span>
            <button class="btn-fullscreen" id="btnFullscreen">⛶ Tela Cheia</button>
        </div>
    </div>

    <!-- ===== GRID ===== -->
    <div class="dashboard-grid">

        <!-- PAINEL 1 -->
        <div class="panel panel-1">
            <div class="panel-title">
                <span><i>📁</i>Projetos em Andamento</span>
                <span class="badge" id="p1-badge">--</span>
            </div>
            <div class="p1-conteudo">
                <div class="projetos-coluna">
                    <div class="projetos-lista" id="p1-lista">
                        <div style="color:#64748b; text-align:center; padding:20px;">Carregando...</div>
                    </div>
                </div>
                <div class="grafico-coluna">
                    <div class="grafico-wrapper">
                        <canvas id="graficoProjetos"></canvas>
                    </div>
                </div>
            </div>
            <div class="resumo-footer">
                <div class="resumo-item resumo-total">
                    <div class="valor" id="p1-total">0</div>
                    <div class="label">Total</div>
                </div>
                <div class="resumo-item resumo-concluido">
                    <div class="valor" id="p1-concluidos">0</div>
                    <div class="label">Concluídos</div>
                </div>
                <div class="resumo-item resumo-andamento">
                    <div class="valor" id="p1-andamento">0</div>
                    <div class="label">Andamento</div>
                </div>
                <div class="resumo-item resumo-atrasado">
                    <div class="valor" id="p1-atrasados">0</div>
                    <div class="label">Atrasados</div>
                </div>
            </div>
        </div>

        <!-- PAINEL 2 -->
        <div class="panel panel-2">
            <div class="panel-title">
                <span><i>🛠️</i>Core Tools — Status</span>
                <span class="badge badge-verde">Qualidade</span>
            </div>
            <div class="tools-grid" id="p2-grid">
                <div style="color:#64748b; grid-column:1/-1; text-align:center; padding:20px;">Carregando...</div>
            </div>
        </div>

        <!-- PAINEL 3 -->
        <div class="panel panel-3">
            <div class="panel-title">
                <span><i>🎬</i>Treinamento em Destaque</span>
                <span class="badge badge-laranja" id="p3-contador">1 / 1</span>
            </div>
            <div class="video-container">
                <iframe id="videoFrame" class="video-frame" src="" title="Treinamento"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen></iframe>
                <div class="progresso-video">
                    <div class="progresso-video-fill" id="progressoVideo"></div>
                </div>
                <div class="video-info">
                    <div class="video-meta">
                        <h3 id="videoTitulo">Carregando...</h3>
                        <p id="videoDescricao">--</p>
                    </div>
                    <span class="video-duracao" id="videoDuracao">--:--</span>
                </div>
            </div>
            <div class="playlist-nav" id="playlistNav"></div>
        </div>
    </div>

    <!-- ===== QR CODE ===== -->
    <div class="qr-flutuante" id="qrFlutuante" title="Aponte a câmera do celular">
        <button class="qr-minimizar" id="qrMinimizar" title="Minimizar">−</button>
        <div id="qrcode"></div>
        <div class="qr-label">📱 Abrir no celular</div>
    </div>

    <script>
        const FONTES = {
            painel1: './dados/painel1.json',
            painel2: './dados/painel2.json',
            painel3: './dados/painel3.json'
        };

        const URL_PADRAO_PAINEL = window.location.href.split('?')[0];

        let graficoProjetos = null;
        let videosPlaylist = [];
        let videoAtual = 0;
        let tempoTrocaVideo = 30;
        let intervaloVideo = null;
        let intervaloProgresso = null;
        let segundosDecorridos = 0;

        async function buscar(url) {
            try {
                const r = await fetch(url + '?v=' + Date.now());
                if (!r.ok) throw new Error('Erro ' + url);
                return await r.json();
            } catch (e) {
                console.error('Falha ao buscar', url, e);
                return null;
            }
        }

        function classeStatus(status) {
            const s = (status || '').toLowerCase();
            if (s.includes('conclu')) return 'status-concluido';
            if (s.includes('execu')) return 'status-execucao';
            if (s.includes('revis')) return 'status-revisao';
            if (s.includes('aguard')) return 'status-aguardando';
            return 'status-execucao';
        }

        function classeBolinha(status) {
            const s = (status || '').toLowerCase();
            if (s.includes('verde')) return 'status-verde';
            if (s.includes('amarelo')) return 'status-amarelo';
            if (s.includes('vermelho')) return 'status-vermelho';
            return 'status-verde';
        }

        function atualizarRelogio() {
            const agora = new Date();
            document.getElementById('relogio').textContent = agora.toLocaleTimeString('pt-BR');
            document.getElementById('dataAtual').textContent = agora.toLocaleDateString('pt-BR');
        }
        setInterval(atualizarRelogio, 1000);
        atualizarRelogio();

        document.getElementById('btnFullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        });

        function gerarQRCode(url) {
            const container = document.getElementById('qrcode');
            container.innerHTML = '';
            new QRCode(container, {
                text: url,
                width: 120,
                height: 120,
                colorDark: '#1e293b',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        document.getElementById('qrMinimizar').addEventListener('click', (e) => {
            e.stopPropagation();
            const qr = document.getElementById('qrFlutuante');
            qr.classList.toggle('minimizado');
            e.target.textContent = qr.classList.contains('minimizado') ? '📱' : '−';
        });

        async function atualizarPainel1() {
            const dados = await buscar(FONTES.painel1);
            if (!dados) return;

            const lista = document.getElementById('p1-lista');
            lista.innerHTML = '';
            dados.projetos.forEach(p => {
                const item = document.createElement('div');
                item.className = 'projeto-item';
                item.style.borderLeftColor = p.cor || '#3b82f6';
                item.innerHTML = `
                    <div class="projeto-linha1">
                        <span class="projeto-nome">${p.nome}</span>
                        <span class="projeto-status ${classeStatus(p.status)}">${p.status}</span>
                    </div>
                    <div class="projeto-progresso">
                        <div class="barra-bg">
                            <div class="barra-fill" style="width:${p.progresso}%; background:${p.cor};"></div>
                        </div>
                        <span class="projeto-pct">${p.progresso}%</span>
                    </div>
                `;
                lista.appendChild(item);
            });

            const r = dados.resumo || {};
            document.getElementById('p1-total').textContent = r.total || dados.projetos.length;
            document.getElementById('p1-concluidos').textContent = r.concluidos || 0;
            document.getElementById('p1-andamento').textContent = r.emAndamento || 0;
            document.getElementById('p1-atrasados').textContent = r.atrasados || 0;
            document.getElementById('p1-badge').textContent = dados.projetos.length + ' ativos';

            const contagem = { 'Concluído': 0, 'Em execução': 0, 'Revisão': 0, 'Aguardando': 0 };
            dados.projetos.forEach(p => {
                const s = (p.status || '').toLowerCase();
                if (s.includes('conclu')) contagem['Concluído']++;
                else if (s.includes('execu')) contagem['Em execução']++;
                else if (s.includes('revis')) contagem['Revisão']++;
                else if (s.includes('aguard')) contagem['Aguardando']++;
            });

            const labels = Object.keys(contagem).filter(k => contagem[k] > 0);
            const valores = labels.map(k => contagem[k]);
            const cores = labels.map(l => {
                if (l === 'Concluído') return '#10b981';
                if (l === 'Em execução') return '#3b82f6';
                if (l === 'Revisão') return '#f59e0b';
                return '#a78bfa';
            });

            const ctx = document.getElementById('graficoProjetos').getContext('2d');
            if (graficoProjetos) {
                graficoProjetos.data.labels = labels;
                graficoProjetos.data.datasets[0].data = valores;
                graficoProjetos.data.datasets[0].backgroundColor = cores;
                graficoProjetos.update('none');
            } else {
                graficoProjetos = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: valores,
                            backgroundColor: cores,
                            borderColor: '#ffffff',
                            borderWidth: 4,
                            hoverOffset: 10
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '62%',
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {
                                    color: '#475569',
                                    font: { size: 10, weight: '600', family: 'Segoe UI' },
                                    padding: 8,
                                    boxWidth: 10,
                                    boxHeight: 10,
                                    usePointStyle: true
                                }
                            },
                            tooltip: {
                                backgroundColor: '#1e293b',
                                padding: 10,
                                callbacks: {
                                    label: (ctx) => {
                                        const total = ctx.dataset.data.reduce((a,b)=>a+b,0);
                                        const pct = ((ctx.raw / total) * 100).toFixed(0);
                                        return ` ${ctx.label}: ${ctx.raw} (${pct}%)`;
                                    }
                                }
                            }
                        }
                    }
                });
            }

            const urlParaQR = dados.urlPainel || URL_PADRAO_PAINEL;
            gerarQRCode(urlParaQR);
        }

        async function atualizarPainel2() {
            const dados = await buscar(FONTES.painel2);
            if (!dados) return;
            const grid = document.getElementById('p2-grid');
            grid.innerHTML = '';
            dados.ferramentas.forEach(f => {
                const card = document.createElement('div');
                card.className = 'tool-card';
                card.innerHTML = `
                    <div class="tool-icone">${f.icone || '🔧'}</div>
                    <div class="tool-sigla">${f.sigla}</div>
                    <div class="tool-nome">${f.nome}</div>
                    <div class="tool-status-bolinha ${classeBolinha(f.status)}"></div>
                    <div class="tool-nivel">${f.nivel}%</div>
                `;
                card.title = `${f.nome} — Responsável: ${f.responsavel}`;
                grid.appendChild(card);
            });
        }

        async function carregarPlaylist() {
            const dados = await buscar(FONTES.painel3);
            if (!dados || !dados.videos) return;
            videosPlaylist = dados.videos;
            tempoTrocaVideo = dados.tempoTroca || 30;
            montarNavPlaylist();
            tocarVideo(0);
            iniciarCicloVideo();
        }

        function montarNavPlaylist() {
            const nav = document.getElementById('playlistNav');
            nav.innerHTML = '';
            videosPlaylist.forEach((v, i) => {
                const dot = document.createElement('div');
                dot.className = 'playlist-dot';
                dot.textContent = i + 1;
                dot.title = v.titulo;
                dot.addEventListener('click', () => {
                    tocarVideo(i);
                    reiniciarCiclo();
                });
                nav.appendChild(dot);
            });
        }

        function tocarVideo(index) {
            if (!videosPlaylist.length) return;
            videoAtual = index;
            const v = videosPlaylist[index];
            document.getElementById('videoFrame').src =
                `https://www.youtube.com/embed/${v.id}?autoplay=1&mute=1&rel=0&modestbranding=1`;
            document.getElementById('videoTitulo').textContent = v.titulo;
            document.getElementById('videoDescricao').textContent = v.descricao;
            document.getElementById('videoDuracao').textContent = v.duracao;
            document.getElementById('p3-contador').textContent = `${index + 1} / ${videosPlaylist.length}`;
            document.querySelectorAll('.playlist-dot').forEach((d, i) => {
                d.classList.toggle('active', i === index);
            });
            segundosDecorridos = 0;
            document.getElementById('progressoVideo').style.width = '0%';
        }

        function iniciarCicloVideo() {
            intervaloVideo = setInterval(() => {
                const dots = document.querySelectorAll('.playlist-dot');
                if (dots[videoAtual]) dots[videoAtual].classList.add('done');
                const proximo = (videoAtual + 1) % videosPlaylist.length;
                tocarVideo(proximo);
                segundosDecorridos = 0;
            }, tempoTrocaVideo * 1000);

            intervaloProgresso = setInterval(() => {
                segundosDecorridos++;
                const pct = (segundosDecorridos / tempoTrocaVideo) * 100;
                document.getElementById('progressoVideo').style.width = pct + '%';
            }, 1000);
        }

        function reiniciarCiclo() {
            clearInterval(intervaloVideo);
            clearInterval(intervaloProgresso);
            segundosDecorridos = 0;
            iniciarCicloVideo();
        }

        async function atualizarTudo() {
            await Promise.all([atualizarPainel1(), atualizarPainel2()]);
        }
        atualizarTudo();
        carregarPlaylist();
        setInterval(atualizarTudo, 30000);

        console.log('%c🎨 Painel colorido ativo', 'color:#3b82f6; font-size:14px; font-weight:bold;');
    </script>
</body>
</html>
